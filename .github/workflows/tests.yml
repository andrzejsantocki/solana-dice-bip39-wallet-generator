name: tests

on:
  push:
  pull_request:

jobs:
  vectors:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
      - name: Install pinned local wheels
        shell: bash
        run: python -m pip install --no-index --find-links=./pkgs --require-hashes -r requirements-hashes.txt
      - name: Run tests
        shell: bash
        run: python -m unittest discover -v -s . -p 'test*.py'
