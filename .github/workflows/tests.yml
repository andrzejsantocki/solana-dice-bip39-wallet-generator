name: tests

on:
  push:
  pull_request:

jobs:
  vectors:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          architecture: 'x64'
      - name: Install pinned local wheels
        shell: bash
        run: python -m pip install --no-index --find-links=./pkgs --require-hashes -r requirements-hashes.txt
      - name: Run tests
        shell: bash
        run: python -m unittest discover -v -s . -p 'test*.py'
